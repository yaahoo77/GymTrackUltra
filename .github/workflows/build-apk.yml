# Buduje APK w chmurze GitHuba po każdym pushu na main.
# Gotowy plik: zakładka Releases → "latest" → GymTrackUltra.apk
# Bezpośredni link: https://github.com/<użytkownik>/<repo>/releases/latest/download/GymTrackUltra.apk
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GymTrackUltra.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GymTrackUltra-apk
          path: GymTrackUltra.apk

      - name: Publish as release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest GymTrackUltra.apk \
            --title "GymTrack Ultra — najnowszy build" \
            --notes "Zbudowano automatycznie z commita ${GITHUB_SHA::7}." \
            --latest
